<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f0e8" />
    <title>MindSprint — Offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:#f4f0e8;color:#18221e;font-family:system-ui,sans-serif}.card{width:min(430px,100%);padding:36px;border:1px solid #dcd8ce;border-radius:24px;background:#fffdf8;text-align:center}.mark{width:58px;height:58px;margin:auto;display:grid;place-items:center;border-radius:17px 17px 17px 5px;background:#1f5d48;color:white;font-size:28px}h1{margin:24px 0 10px;font-size:34px;letter-spacing:-.05em}p{margin:0;color:#69716c;line-height:1.6}button{margin-top:24px;padding:14px 22px;border:0;border-radius:13px;background:#1f5d48;color:white;font:700 15px system-ui;cursor:pointer}
    </style>
  </head>
  <body><main class="card"><div class="mark">✦</div><h1>You’re offline</h1><p>MindSprint will reconnect when your network returns. Previously loaded training sessions remain available from the installed app.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
